site_name: stlib-ext

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md

  - moretyping:
    - Home: moretyping/index.md
    - Data:
        - Overview: moretyping/data/index.md
        - moretyping.data:
            - Number: moretyping/data/number.md
            - MutableEnum: moretyping/data/mutable_enum.md

    - Visualise:
        - Overview: moretyping/visualise/index.md
        - moretyping.vis:
            - VisLink: moretyping/visualise/vis-link.md
            - ViewJSON: moretyping/visualise/view-json.md

  - morefunctools:
    - Home: morefunctools/index.md
    - API:
      - morefunctools.experimental: morefunctools/experimental.md
      - morefunctools.fifo_cache: morefunctools/fifo-cache.md
      - morefunctools.not_implemented: morefunctools\notimplemented.md

  - os_ext:
    - Home: os_ext/index.md
    - API:
      - os_ext.details: os_ext/details.md
  
  - moreshell:
    - Home: moreshell/index.md
    - API:
      - moreshell.color: moreshell/color.md
      - moreshell.cursor: moreshell/cursor.md
      - moreshell.details: moreshell/details.md

  - morelogging:
    - Home: morelogging/index.md
    - API:
      - morelogging.enums:
        - LogLevel: morelogging/loglevel/index.md
      - .data_wrappers:
        - Home: morelogging/data_wrappers/index.md
        - API:
          - .Log: morelogging\data_wrappers\log.md
          - .LogStreamInfo: morelogging\data_wrappers\lsi.md
      - morelogging.LogHandler: morelogging/log_handler/index.md
      - morelogging.SimpleLogHandler: morelogging/log_handler/simple_log_handler.md
      - morelogging.LogStream: morelogging/log_stream/index.md
      - morelogging.Logger: morelogging/logger/index.md
      - morelogging.compat: morelogging/compat/index.md